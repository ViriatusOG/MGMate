name: Android app

# Builds the Android app (android/), runs its tests, and keeps an installable APK ready: as an
# artifact on every run, and on the rolling "android-latest" pre-release for builds of main.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android.yml
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android.yml

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from the git tags, as it does for the server (MinVer).
          fetch-depth: 0

      # The runner image carries JDK 17 and the Android SDK; nothing to install.
      - name: Use JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Work out the version
        id: version
        run: |
          described=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || echo "v0.0.0-$(git rev-list --count HEAD)")
          echo "name=${described#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # With the signing secrets set, every build carries the same signature, so a new APK
      # installs over the old one. Without them the build is signed with a throwaway debug key.
      - name: Fetch the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MGMATE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mgmate.jks"
            echo "file=$RUNNER_TEMP/mgmate.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No signing key set: this APK is signed with a throwaway debug key and will not install over another build."
          fi

      - name: Test and build
        working-directory: android
        env:
          MGMATE_KEYSTORE_FILE: ${{ steps.signing.outputs.file }}
          MGMATE_KEYSTORE_PASSWORD: ${{ secrets.MGMATE_KEYSTORE_PASSWORD }}
          MGMATE_KEY_ALIAS: ${{ secrets.MGMATE_KEY_ALIAS }}
          MGMATE_KEY_PASSWORD: ${{ secrets.MGMATE_KEY_PASSWORD }}
        run: |
          # An empty variable means "no key", which Gradle must see as unset.
          if [ -z "$MGMATE_KEYSTORE_FILE" ]; then unset MGMATE_KEYSTORE_FILE; fi
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -Pmgmate.versionName="${{ steps.version.outputs.name }}" \
            -Pmgmate.versionCode="${{ steps.version.outputs.code }}"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/mgmate.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mgmate-android
          path: ${{ runner.temp }}/mgmate.apk
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish the latest APK
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To move the android-latest tag and replace the APK on its pre-release.
      contents: write
      # To fetch the APK from the build job.
      actions: read
    steps:
      - name: Fetch the APK this run built
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name mgmate-android

      - name: Replace the APK on the android-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ needs.build.outputs.version-name }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
        run: |
          # The app's own update check reads this file to learn whether a newer build exists.
          printf '{"versionCode": %s, "versionName": "%s"}\n' "$VERSION_CODE" "$VERSION_NAME" > version.json
          notes="MGMate for Android $VERSION_NAME, the newest build from main (commit ${GITHUB_SHA::7}). Download mgmate.apk on your phone and open it to install. Once installed, the app updates itself from here: Settings, then Update."
          title="MGMate for Android $VERSION_NAME"
          if gh release view android-latest >/dev/null 2>&1; then
            # The APK first: a phone that sees the new version.json must find the new APK too.
            gh release upload android-latest mgmate.apk --clobber
            gh release upload android-latest version.json --clobber
            gh release edit android-latest --title "$title" --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create android-latest mgmate.apk version.json --prerelease --title "$title" --notes "$notes" --target "$GITHUB_SHA"
          fi
